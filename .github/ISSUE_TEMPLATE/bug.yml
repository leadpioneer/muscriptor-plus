name: Баг (репорт)
description: Падение, сообщение об ошибке, неверная работа кода (не модели)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Если проблема в качестве расшифровки («модель неправильно распознала мою песню»),
        используйте шаблон *Некорректная расшифровка*.
  - type: textarea
    id: what
    attributes:
      label: Что произошло?
      description: Что ожидали, что получили. Вставьте полный traceback или текст ошибки.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Как воспроизвести
      description: "Точные команды. Если проблема только с конкретным файлом, приложите его:
        перетащите файл прямо в это поле или дайте ссылку на Google Drive/Dropbox."
      placeholder: |
        1. muscriptor transcribe song.wav --format sheets
        2. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Окружение
      description: ОС, версия Python, `muscriptor --version`, устройство (CPU/CUDA/MPS).
      placeholder: |
        Windows 11, Python 3.12, muscriptor 0.3.0, CUDA (RTX 5060 Ti)
    validations:
      required: true
