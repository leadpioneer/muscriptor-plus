name: Некорректная расшифровка
description: Модель распознала песню неверно (пропущенные ноты, не тот инструмент, сбитый ритм…)
labels: ["transcription quality"]
body:
  - type: markdown
    attributes:
      value: |
        **Без аудио сделать ничего нельзя.** К каждому отчёту нужно приложить
        именно тот файл, который расшифровывался, иначе проблему не воспроизвести.

        Учтите: модель не идеальна, отдельные неверные ноты — ожидаемая ситуация,
        и ответ будет «поправить потом в DAW или нотном редакторе». Ищем
        системные проблемы: долгие выпадения звука, все ноты на одном треке,
        полностью потерянная партия.
  - type: textarea
    id: audio
    attributes:
      label: Аудио-файл
      description: |
        Перетащите файл прямо в это поле или дайте ссылку на Google Drive/Dropbox.
        (Почта для вложений не используется — только GitHub Issues.)
      placeholder: (перетащите файл в это поле)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что не так, и в каком месте?
      description: |
        Пара предложений плюс таймкоды, например: «Гитара исчезает с 3:05 до 3:45».
        Поможет скриншот пиано-ролла.
      placeholder: |
        Хай-хэт распознаётся как 8 ударов в такт вместо 4, с самого начала.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Как запускали?
      description: Точная команда, либо «веб-интерфейс (локальный сервер)».
      placeholder: muscriptor transcribe song.wav --model large
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия
      description: Вывод `muscriptor --version`. Пропустите, если пользовались веб-интерфейсом.
      placeholder: "0.3.0"
  - type: markdown
    attributes:
      value: |
        Напишите отчёт своими словами — короткий человекописанный текст
        полезнее длинного текста, сгенерированного ИИ.
