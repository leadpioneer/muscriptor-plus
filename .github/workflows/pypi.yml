name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    # The PyPI name `muscriptor` belongs to the upstream repository: a release
    # cut in a fork must never try to publish over it (the credentials or the
    # name would fail, and at best it is confusing). Only upstream publishes.
    if: github.repository == 'muscriptor/muscriptor'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build frontend into muscriptor/web_dist
      run: |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm run build
      working-directory: web
    - name: Build wheels
      run: uv build
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    
