[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muscriptor"
version = "0.3.0"
description = "Music transcription to MIDI and sheet music using a transformer language model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LeadPioneer" }]
keywords = [
    "audio",
    "midi",
    "transcription",
    "music",
    "transformer",
    "sheet-music",
    "notation",
    "musicxml",
    "tablature",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    # PyTorch stopped publishing Intel-mac (darwin x86_64) wheels after 2.2.2,
    # which only has wheels up to Python 3.12: on Intel macs pin torch (and
    # NumPy 1.x, which torch 2.2.2 was compiled against) and run under
    # Python <= 3.12, e.g. `uvx --python 3.12 muscriptor` (see README).
    # The non-Intel floors must exclude the Intel-capped versions, otherwise uv
    # unifies both branches on the old pin instead of forking the resolution.
    "torch>=2.3 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.0,<2.3 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=2 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.24,<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "einops>=0.4",
    "mido>=1.3",
    "packaging>=20.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.13",
    "typer>=0.10",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.29",
    "soundfile>=0.14.0",
    "beat-this>=1.1",  # Tempo and downbeat tracking
    # Optional lead-vocal removal before transcription (MuScriptor Plus).
    # The [cpu] extra supplies the onnxruntime that audio_separator's module
    # imports unconditionally (the RoFormer models we use run on torch, so the
    # CPU build suffices; the [gpu] extra would pull onnxruntime-gpu whose CUDA
    # DLLs can clash with the cu128 torch build).
    # Excluded on Intel macs: audio-separator needs torch>=2.3 / numpy>=2,
    # which the Intel-mac compat pin below (torch<2.3, numpy<2) forbids —
    # there the preprocessor reports the missing dependency as a clear error.
    "audio-separator[cpu]>=0.44,<0.48 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # audio_separator's bundled uvr_lib imports audioread directly, but the
    # package metadata doesn't declare it (librosa >=0.10 dropped it) — declare
    # it here so the import works. Same platform scope as audio-separator.
    "audioread>=3 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.urls]
Homepage = "https://github.com/leadpioneer/muscriptor-plus"
Repository = "https://github.com/leadpioneer/muscriptor-plus"
Issues = "https://github.com/leadpioneer/muscriptor-plus/issues"

[project.scripts]
muscriptor = "muscriptor.main:main"

[tool.hatch.build]
# The built frontend is gitignored but must ship in the sdist/wheel so that
# `uvx muscriptor serve` has a UI. Built by `pnpm build` in web/.
artifacts = ["muscriptor/web_dist"]

[tool.hatch.build.targets.wheel]
packages = ["muscriptor"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
]
notebooks = [
    "plotly>=5.20",
    "jupyterlab>=4.0",
]

# Windows: PyPI's default torch wheel is CPU-only, and Blackwell GPUs
# (RTX 50xx) need the CUDA 12.8 build, which PyPI does not carry. On win32 the
# torch wheels therefore come from PyTorch's own cu128 index; every other
# platform keeps the default registry.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
